name: Build Android SDK Sidecar

on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: 'JDK Version'
        required: false
        default: '21'
      sdk_version:
        description: 'Android SDK version'
        required: false
        default: '36'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/android-sdk:latest
          build-args: |
            JDK_VERSION=${{ github.event.inputs.jdk_version }}
            SDK_VERSION=${{ github.event.inputs.sdk_version }}
