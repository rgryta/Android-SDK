name: Check for New Dependency Versions

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      updates_available: ${{ steps.compare.outputs.updates_available }}
      changelog: ${{ steps.compare.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load current versions
        id: current
        run: |
          source .versions
          echo "image_version=${IMAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "jdk_version=${JDK_VERSION}" >> $GITHUB_OUTPUT
          echo "sdk_version=${SDK_VERSION}" >> $GITHUB_OUTPUT

      - name: Check latest LTS JDK version
        id: check-jdk
        run: |
          LATEST=$(curl -sL "https://api.adoptium.net/v3/info/available_releases" | jq -r '.most_recent_lts')
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest LTS JDK: ${LATEST}"

      - name: Check latest Android SDK version
        id: check-sdk
        run: |
          LATEST_SDK=$(curl -sL "https://dl.google.com/android/repository/repository2-3.xml" | \
            grep -oP 'android-\K[0-9]+' | sort -rn | head -1)
          echo "latest=${LATEST_SDK}" >> $GITHUB_OUTPUT
          echo "Latest Android SDK: ${LATEST_SDK}"

      # Gradle JDK compatibility: https://docs.gradle.org/current/userguide/compatibility.html
      - name: Compare versions
        id: compare
        run: |
          UPDATES=""
          CHANGELOG=""

          if [ "${{ steps.current.outputs.jdk_version }}" != "${{ steps.check-jdk.outputs.latest }}" ] && [ -n "${{ steps.check-jdk.outputs.latest }}" ]; then
            UPDATES="true"
            CHANGELOG="${CHANGELOG}- **JDK**: ${{ steps.current.outputs.jdk_version }} → ${{ steps.check-jdk.outputs.latest }}\n"
            echo "JDK update available: ${{ steps.current.outputs.jdk_version }} -> ${{ steps.check-jdk.outputs.latest }}"
          fi

          if [ "${{ steps.current.outputs.sdk_version }}" != "${{ steps.check-sdk.outputs.latest }}" ] && [ -n "${{ steps.check-sdk.outputs.latest }}" ]; then
            UPDATES="true"
            CHANGELOG="${CHANGELOG}- **Android SDK**: ${{ steps.current.outputs.sdk_version }} → ${{ steps.check-sdk.outputs.latest }}\n"
            echo "Android SDK update available: ${{ steps.current.outputs.sdk_version }} -> ${{ steps.check-sdk.outputs.latest }}"
          fi

          if [ -z "$UPDATES" ]; then
            echo "All dependencies are up to date"
            echo "updates_available=false" >> $GITHUB_OUTPUT
          else
            echo "updates_available=true" >> $GITHUB_OUTPUT
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Update .versions file
        if: steps.compare.outputs.updates_available == 'true'
        run: |
          source .versions

          NEW_JDK="${{ steps.check-jdk.outputs.latest }}"
          NEW_SDK="${{ steps.check-sdk.outputs.latest }}"
          [ -z "$NEW_JDK" ] && NEW_JDK="${JDK_VERSION}"
          [ -z "$NEW_SDK" ] && NEW_SDK="${SDK_VERSION}"

          cat > .versions << EOF
          IMAGE_VERSION=${IMAGE_VERSION}
          JDK_VERSION=${NEW_JDK}
          SDK_VERSION=${NEW_SDK}
          EOF

          echo "Updated .versions:"
          cat .versions

      - name: Create Pull Request
        if: steps.compare.outputs.updates_available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: deps/version-updates
          title: "chore(deps): update dependency versions"
          body: |
            ## Dependency Updates

            ${{ steps.compare.outputs.changelog }}

            ---
            **To trigger a build:** bump `IMAGE_VERSION` in `.versions` before merging.

            *Auto-generated by version checker workflow*
          labels: dependencies
          commit-message: "chore(deps): update dependency versions"
